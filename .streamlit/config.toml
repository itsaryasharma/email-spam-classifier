# Light and dark appearance. Defining both [theme.light] and [theme.dark]
# enables Streamlit's built-in theme switch (menu -> Settings -> Theme).
# Theme colours cannot be changed from Python code, so they live here.

[theme]
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#E11D48"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF1F2"
textColor = "#111827"
borderColor = "#D1D5DB"

[theme.dark]
primaryColor = "#E11D48"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#2A1A20"
textColor = "#E5E7EB"
borderColor = "#374151"

[browser]
gatherUsageStats = false
